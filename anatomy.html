<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анатомія «Фортеці»</title>
<link rel="stylesheet" href="media/fonts/fonts.css">
<style>
*{box-sizing:border-box}
html{color-scheme:light}
.iso{--hh-wave:#cf8a00;--hh-ink:#18181a;--hh-serif:"IBM Plex Sans",system-ui,sans-serif;--anatomy-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.iso-root{min-height:100%;background:radial-gradient(90% 70% at 50% 38%,#fbfbfa 0%,#f5f5f3 60%,#efefec 100%) fixed;color:var(--anatomy-text);font:15px/1.6 "IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1252px;margin:0 auto;padding-block:40px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* --- шапка, як у референсі: серифний заголовок, курсивний підзаголовок, чип стану --- */
.head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
h1{margin:0;color:var(--hh-ink);font:300 48px/1.05 var(--hh-serif);letter-spacing:-.02em}
.lede{margin:8px 0 0;font:italic 15px/1.5 var(--hh-serif);color:#8b8b8f}
.tag{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:4px 11px 4px 9px;border-radius:99px;background:#fff;box-shadow:var(--anatomy-lift);font:10.5px/1.5 var(--anatomy-mono);letter-spacing:.09em;text-transform:uppercase;color:#4a4a4e}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hh-ink)}
.legend{display:grid;grid-template-columns:auto auto;gap:3px 18px;padding:10px 14px;border-radius:8px;background:#fff;box-shadow:var(--anatomy-lift);font:10px/1.5 var(--anatomy-mono);color:#6d6d72;letter-spacing:.03em;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:1px solid #26262a}
.legend i.sel{border-top-width:2px;border-color:#000}
.legend i.wave{border-top:2px solid var(--hh-wave)}
.legend i.zone{border-top:2px solid var(--anatomy-red)}
.legend i.faint{border-color:#c4c4c8}
.legend i.cut{width:14px;height:9px;border:1px solid #18181a;background:repeating-linear-gradient(45deg,#55554f 0 .6px,#ecebe6 .6px 3px)}
.legend i.dot{width:6px;height:6px;border:1px solid #6d6d72;border-radius:50%}

/* --- поле креслення: папір із м'якою віньєткою --- */
.plate{position:relative;margin:10px 0 0;padding:18px 0 34px;background:transparent;overflow:visible;--anatomy-paper:#f7f7f5}
.corner{position:absolute;color:#9a9a9e;font:10px/1 var(--anatomy-mono);letter-spacing:.1em;white-space:nowrap;text-transform:uppercase}
.corner.fig{top:0;left:0;color:#55555a;letter-spacing:.04em;text-transform:none}
.corner.hint{top:18px;left:0}
.corner.src{display:none}
.plate{padding-bottom:70px}
.stage{outline:none}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
.stage{position:relative}
.stage svg.hh-bg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.stage svg.hh-fg{position:relative;will-change:transform}
.hh-item{cursor:pointer}
.hh-item[data-asm="ground"]{cursor:default}
.hh-item[data-sel] .iso-edge{stroke:var(--anatomy-lit);stroke-width:.9px}
.hh-item[data-sel] .iso-crease{stroke:var(--anatomy-hi)}
.hh-item[data-hover] .iso-edge{stroke:var(--anatomy-lit)}
.stage .hh-item .iso-line{transition:stroke-opacity .35s}
.stage[data-has-sel] .hh-item:not([data-sel]):not([data-asm="ground"]) .iso-line{stroke-opacity:.26}
.stage[data-has-sel] .hh-item[data-sel] .iso-edge{stroke-width:1.15px}
.hh-item[data-hit] .iso-edge{stroke:color-mix(in srgb,var(--hh-wave) var(--hit),var(--anatomy-hi));stroke-opacity:1!important}
/* гравюра: тіньові грані штриховані, світлі — чисті */
.stage .iso-shade[data-shade="0"]{fill:url(#hh-h0)}
.stage .iso-shade[data-shade="1"]{fill:url(#hh-h1)}
.stage .iso-shade[data-shade="2"]{fill:url(#hh-h2)}
.stage[data-moving]:not([data-sprites]) .iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.stage[data-moving]:not([data-sprites]) .iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.stage[data-moving]:not([data-sprites]) .iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
/* швидкий рух: деталі — знімки-шари, SVG-деталі прозорі (але й далі ловлять дотик) */
.stage .hh-sprites{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden}
.stage[data-sprites] .hh-sprites{visibility:visible}
.hh-sprites img{position:absolute;left:0;top:0;max-width:none;will-change:transform}
.stage[data-sprites] svg.hh-fg .hh-item{opacity:0!important}
.stage[data-snap] *{transition:none!important}
.tip{position:absolute;top:0;left:0;z-index:4;padding:7px 10px 8px;border-radius:6px;background:#fff;box-shadow:0 0 0 1px #00000014,0 8px 22px -10px #00000040;pointer-events:none;white-space:nowrap;transition:opacity .15s}
.tip{opacity:0}.tip.on{opacity:1}
.tip b{display:block;color:var(--hh-ink);font:600 12.5px/1.3 "IBM Plex Sans",sans-serif}
.tip span{display:block;margin-top:2px;color:#8b8b8f;font:10.5px/1.3 var(--anatomy-mono);letter-spacing:.02em}
.stage svg{touch-action:none;-webkit-user-select:none;user-select:none}
.hh-cutview{display:none}
.stage[data-cut] .hh-cutview{display:inline}
.stage[data-cut] .hh-full,.stage[data-cut] .hh-wave,.stage[data-cut] .hh-wavelabel{display:none}
.hh-cut{fill:url(#hh-cutp);stroke:none}.hh-cut2{fill:url(#hh-cutp2)}
.hh-cutedge{stroke:#18181a!important;stroke-width:1.25px!important}
.hh-labels{animation:hh-in .5s ease both .15s}
@keyframes hh-in{from{opacity:0}to{opacity:1}}
.hh-leader{fill:none;stroke:#18181a;stroke-width:.7px;vector-effect:non-scaling-stroke}
.hh-node{fill:#fff;stroke:#18181a;stroke-width:1px;vector-effect:non-scaling-stroke}
.hh-tag-bg{fill:#fff;stroke:#00000024;stroke-width:.7px;vector-effect:non-scaling-stroke;filter:drop-shadow(0 3px 6px #0000001a)}
.hh-tag-t{fill:#18181a;font:600 10.5px/1 "IBM Plex Sans",sans-serif}
.hh-tag-s{fill:#77777c;font:9px/1 "IBM Plex Mono",monospace;letter-spacing:.02em}
.hh-dim path{fill:none;stroke:#18181a;stroke-width:.8px;vector-effect:non-scaling-stroke}
.hh-dim-t{fill:#18181a!important;font-weight:500!important}
.hh-wavelabel .hh-tag-t{fill:#8a5a00}
.card[data-wide]{width:350px}
.wsteps{list-style:none;margin:2px 0 8px;padding:0;display:grid;gap:5px}
.wsteps li{display:grid;grid-template-columns:20px auto 1fr;gap:8px;align-items:center;color:#9a9a9e;transition:color .25s}
.wsteps i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid #cfcfcb;font:500 10px/1 var(--anatomy-mono);font-style:normal;color:#8b8b8f;transition:background .25s,border-color .25s,color .25s}
.wsteps b{font:600 12.5px/1.2 "IBM Plex Sans",sans-serif;color:#6d6d72}
.wsteps span{font-size:11.5px;line-height:1.3;min-width:0}
.wsteps li[data-done] i{background:#18181a;border-color:#18181a;color:#fff}
.wsteps li[data-on] i{background:var(--hh-wave);border-color:var(--hh-wave);color:#fff}
.wsteps li[data-on] b{color:#18181a}.wsteps li[data-on] span{color:#55555a}
.wchart{display:block;width:100%;height:auto;margin:2px 0 10px}
.wc-axis{fill:none;stroke:#b9b9bd;stroke-width:.8}
.wc-ref{fill:none;stroke:#8d8d92;stroke-width:.8;stroke-dasharray:3 3}
.wc-max{fill:none;stroke:var(--anatomy-red);stroke-width:1}
.wc-t{fill:#8b8b8f;font:8.5px/1 var(--anatomy-mono)}.wc-red{fill:var(--anatomy-red)}
.wc-ghost{fill:none;stroke:#e6d3a3;stroke-width:1;stroke-dasharray:2 2}
.wc-line{fill:none;stroke:var(--hh-wave);stroke-width:1.8;stroke-linejoin:round}
.wc-dot{fill:var(--hh-wave);stroke:#fff;stroke-width:1.2}
.hh-zone{fill:var(--hh-wave);fill-opacity:.12;stroke:none}
.hh-burst-fill{fill:var(--hh-wave);fill-opacity:.28;stroke:none}
.hh-burst-line{fill:none;stroke:#a86a00;stroke-width:1px;vector-effect:non-scaling-stroke}
.hh-burst-dot{fill:#a86a00}
.hh-front{fill:none;stroke:var(--hh-wave);stroke-linecap:round;vector-effect:non-scaling-stroke}
.hh-cable{fill:none;stroke:#3a3a3e;stroke-width:.8px;vector-effect:non-scaling-stroke}
.hh-sling{fill:none;stroke:#3a3a3e;stroke-width:.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hh-hook{fill:#fff;stroke:#18181a;stroke-width:1px;vector-effect:non-scaling-stroke}
.iso{--anatomy-hi:#2c2c30;--anatomy-mid:#8d8d92;--anatomy-lo:#b9b9bd;--anatomy-faint:#d9d9db;--anatomy-weight:.62px;
  --anatomy-shade-0:#e1e1de;--anatomy-shade-1:#e9e9e6;--anatomy-shade-2:#f0f0ed;--anatomy-shade-3:#f6f6f4;--anatomy-top:#fdfdfc;--anatomy-halo:#7a7a72;--anatomy-halo-opacity:.22}

/* --- картка шару, як у референсі з навушниками --- */
.card{position:absolute;top:8px;right:0;width:310px;padding:14px 16px 13px;background:#fff;border-radius:8px;box-shadow:0 0 0 1px #0000000d,0 1px 2px #0000000a,0 12px 32px -14px #00000033;font-size:13px;line-height:1.55;color:#4a4a4e}
.card[hidden]{display:none}
.card header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card h2{margin:0;flex:1;color:var(--hh-ink);font:500 17px/1.25 var(--hh-serif)}
.card button{width:22px;height:22px;padding:0;border:0;border-radius:5px;background:#f4f4f2;box-shadow:inset 0 0 0 1px #0000000f;color:#55555a;font:12px/1 var(--anatomy-mono);cursor:pointer}
.card button:hover{background:#ebebe8}
.card p{margin:0 0 11px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;padding-top:10px;border-top:1px solid #0000000d}
.card dt{font:9.5px/2 var(--anatomy-mono);letter-spacing:.08em;text-transform:uppercase;color:#9a9a9e}
.card dd{margin:0;color:var(--hh-ink)}

/* --- пульт, як у референсі ATLAS --- */
.console{position:relative;display:grid;grid-template-columns:minmax(250px,320px) 1fr auto auto;gap:26px;align-items:end;margin:-40px 40px 0;padding:16px 18px;border-radius:12px;background:linear-gradient(#fdfdfc,#f4f4f2);box-shadow:0 0 0 1px #0000000f,0 1px 0 #ffffff inset,0 2px 4px -2px #0000001a,0 18px 36px -18px #0000003d;z-index:2}
.console::before,.console::after{content:"";position:absolute;top:9px;width:5px;height:5px;border-radius:50%;background:#d5d5d2;box-shadow:inset 0 1px 1px #00000026}
.console::before{left:9px}.console::after{right:9px}
.screen{padding:12px 15px;border-radius:7px;background:#121212;box-shadow:inset 0 0 0 1px #000,inset 0 8px 16px #00000080,0 1px 0 #fff;color:#ececec;font:13px/1.45 var(--anatomy-mono);min-height:68px}
.screen b{display:block;font-weight:500;font-size:15.5px;letter-spacing:.02em}
.screen span{display:block;margin-top:3px;color:#8f8f8f;font-size:11px}
.grp{display:grid;gap:7px}
.grp>label,.grp>.lbl{font:9px/1 var(--anatomy-mono);letter-spacing:.14em;text-transform:uppercase;color:#a0a0a4}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:0;border-radius:6px;background:linear-gradient(#fff,#f3f3f1);box-shadow:0 0 0 1px #00000014,0 1px 1px #0000000f,0 2px 0 -1px #0000000d;color:#3e3e42;font:11px/1.2 var(--anatomy-mono);cursor:pointer;transition:transform .08s,box-shadow .08s}
.key:active{transform:translateY(1px);box-shadow:0 0 0 1px #00000014}
.key i{font-style:normal;color:#a6a6aa}
.key::before{content:"";position:absolute;top:-8px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#d8d8d5}
.key[aria-pressed="true"]::before{background:var(--hh-ink);box-shadow:0 0 0 2px #18181a14}
.key[aria-pressed="true"]{color:var(--hh-ink);box-shadow:0 0 0 1px #00000040,0 1px 1px #0000000f}
.key.dark{background:linear-gradient(#2a2a2c,#161617);color:#f2f2f2;box-shadow:0 0 0 1px #000,0 1px 1px #00000033}
.key.dark::before{display:none}
.wavebox{display:flex;align-items:center;gap:10px}
.wavebox output{min-width:62px;font:12px/1 var(--anatomy-mono);color:var(--hh-ink);text-align:right}
input[type=range]{--fill:50%;width:170px;height:22px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--hh-wave) var(--fill),#dededb var(--fill));box-shadow:inset 0 1px 1px #0000001f}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--hh-wave) var(--fill),#dededb var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:linear-gradient(#fff,#ececea);box-shadow:0 0 0 1px #00000026,0 2px 3px #00000026}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #00000026,0 2px 3px #00000026}
.marks{position:relative;width:170px;height:10px;font:8.5px/1 var(--anatomy-mono);color:#a6a6aa}
.marks span{position:absolute;top:0;transform:translateX(-50%)}

/* --- факти --- */
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:44px;border-top:1px solid #0000001a}
.fact{padding:18px 20px 4px 0}
.fact+.fact{padding-left:20px;border-left:1px solid #0000000f}
.fact b{display:block;color:var(--hh-ink);font:400 28px/1.15 var(--hh-serif)}
.fact span{display:block;margin-top:4px;font-size:13px;color:#8b8b8f}
.notes{margin-top:26px;font-size:12.5px;color:#9a9a9e;max-width:780px}

@media (max-width:1000px){
  .console{grid-template-columns:1fr 1fr;margin:14px 0 0}
  .screen{grid-column:1/-1}
  .legend{display:none}
}
@media (max-width:640px){
  h1{font-size:32px}
  .plate{padding:40px 4px 40px;border-radius:10px}
  .card{position:static;width:auto;margin:10px 10px 0}
  .console{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .fact:nth-child(3){padding-left:0;border-left:0}
  .corner.src{display:none}
  .corner.hint .wide{display:none}
  .stage svg{width:100%;margin-left:0}
  .plate{overflow:hidden}
  .iso-root{overflow-x:hidden}
  .keys .key{padding:7px 8px}
  input[type=range],.marks{width:100%}
  .wavebox{flex-wrap:wrap}
}

html,body{background:#f3f3f1;color-scheme:light}
body{overflow-x:hidden}
:focus-visible{outline:2px solid #18181a;outline-offset:2px}

html.embed .head{display:none}
html.embed .page{padding-block:8px 24px}
html.embed .plate{margin-top:0}
.key{white-space:nowrap}
@media (min-width:641px){html.embed .console{grid-template-columns:minmax(230px,300px) minmax(0,1fr) auto;align-items:start}html.embed .console>.screen{grid-row:span 2;align-self:stretch}html.embed .console>.grp:nth-child(2){grid-column:2/4}}
</style>
<script>if(new URLSearchParams(location.search).has('embed')){document.documentElement.classList.add('embed');const send=()=>document.body&&parent.postMessage({hhAnatomyHeight:Math.ceil(document.body.scrollHeight)},'*');addEventListener('DOMContentLoaded',()=>new ResizeObserver(send).observe(document.body));addEventListener('load',send);addEventListener('message',e=>{if(e.data==='hhAnatomyPing')send()});}</script>
<script src="anatomy_en.js"></script>
<script src="i18n.js"></script>
<script>addEventListener("storage",e=>{if(e.key==="hh_lang"&&window.HHsetLang)HHsetLang(e.newValue)});</script>
</head><body>
<div class="iso iso-root" data-theme="light">
<main class="page">
  <div class="head">
    <div>
      <h1>Анатомія «Фортеці»</h1>
      <p class="lede">Збірне залізобетонне укриття Hobbit House, розібране по шарах. Геометрія — з робочої CAD-моделі, у масштабі.</p>
      <span class="tag" data-tag>ціла споруда</span>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i></i>контур</span><span><i class="wave"></i>фронт хвилі</span>
      <span><i class="sel"></i>обраний шар</span><span><i class="zone"></i>понад 500 кПа</span>
      <span><i class="faint"></i>злам поверхні</span><span><i class="cut"></i>переріз</span>
    </div>
  </div>

  <figure class="plate">
    <span class="corner fig">Fig 1 · Фортеця 3,5</span>
    <div class="tip" data-tip></div>
    <div class="stage" data-stage tabindex="0" aria-label="Схема укриття. Стрілки — шари, пробіл — розкрити, M — монтаж, W — хвиля."></div>
    <aside class="card" data-card hidden>
      <header><h2 data-card-title></h2>
        <button type="button" data-card-prev aria-label="Попередній шар">‹</button>
        <button type="button" data-card-next aria-label="Наступний шар">›</button>
        <button type="button" data-card-close aria-label="Закрити">×</button>
      </header>
      <p data-card-text></p>
      <div data-card-extra></div>
      <dl data-card-rows></dl>
    </aside>
    <span class="corner hint">клік — шар · свайп угору — розкрити<span class="wide"> · C розріз · M монтаж · W хвиля</span></span>
    <span class="corner src">обміри: CAD «Фортеця 3,5_3ХЛ»</span>
  </figure>

  <section class="console" aria-label="Пульт">
    <div class="screen" aria-live="polite"><b data-screen1></b><span data-screen2></span></div>
    <div class="grp"><span class="lbl">Шар</span>
      <div class="keys">
        <button class="key" type="button" data-layer="slab"><i>01</i>плита</button>
        <button class="key" type="button" data-layer="buttress"><i>02</i>контрфорси</button>
        <button class="key" type="button" data-layer="walls"><i>03</i>стіни</button>
        <button class="key" type="button" data-layer="ends"><i>04</i>торці</button>
        <button class="key" type="button" data-layer="tambour"><i>05</i>тамбури</button>
        <button class="key" type="button" data-layer="vault"><i>06</i>арковий дах</button>
      </div>
    </div>
    <div class="grp"><label for="kpa">Хвиля тиску</label>
      <div class="wavebox">
        <div><input id="kpa" type="range" min="0" max="600" step="10" value="300" data-kpa aria-label="Надлишковий тиск на фронті, кПа">
          <div class="marks"><span style="left:3%">0</span><span style="left:18%">100</span><span style="left:83%">500</span><span style="left:97%">600</span></div></div>
        <output data-kpa-out>300 кПа</output>
        <button class="key dark" type="button" data-wave-btn>▶ Хвиля</button>
        <button class="key" type="button" data-wave-info aria-label="Що таке ударна хвиля">?</button>
      </div>
    </div>
    <div class="grp"><span class="lbl">Вигляд</span>
      <div class="keys">
        <button class="key" type="button" data-open-btn aria-pressed="false">Розкрити</button>
        <button class="key" type="button" data-cut-btn aria-pressed="false">Розріз</button>
        <button class="key dark" type="button" data-play>▶ Монтаж</button>
      </div>
    </div>
  </section>
</main>
</div>
<script type="module">
const __iso = (() => {
const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}

    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];

    const count = Math.max(1, Math.ceil((to - from) / fine));

  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;

  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);

      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));

  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;

    const out = { ...arc };

      out.to -= TAU;

      out.to += TAU;

  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;

        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);

  };

    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));

  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);

  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];

      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;

  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;

      const a = run.map((j) => rings[i][j]);

      all.push(d);

  const flatV = Math.hypot(uV, vV);

    const c = (dr * aV) / (ds * flatV);

    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));

    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));

  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

  let bevelPath = "";

    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;

  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;

    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });

    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";

      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {

  return svg.map((list) => `<g class="iso-solid" data-seamless="">${list.join("")}</g>`);
}

function bodiesOf(list, cut) {
  const covers = list.filter((b) => b.kind === "cover").sort((a, b) => a.lo[0] - b.lo[0]);
  const out = list.map((it) => {
    const b = { kind: it.kind, lo: it.lo, hi: it.hi, polys: it.chunks.flatMap((c) => c.polys.map(triples)), section: it.section };
    b.index = covers.findIndex((c) => c.lo[0] === it.lo[0] && c.kind === it.kind);
    return b;
  });
  // плита підлоги 140 мм під усією спорудою (товщина — за групою «Перекрытия» CAD)
  const x1 = cut ? CUT : LEN;
  const slabFaces = prism("z", [[0, 0], [x1, 0], [x1, W], [0, W]], -SLAB, 0);
  const kept = cut ? slabFaces.filter((f) => !f.p.every((q) => Math.abs(q[0] - CUT) < 1)) : slabFaces;
  const slab = { kind: "slab", lo: [0, 0, -SLAB], hi: [x1, W, 0], polys: kept.map((f) => f.p), norms: kept.map((f) => f.n) };
  if (cut) slab.section = [[[0, -SLAB], [W, -SLAB], [W, 0], [0, 0]]];
  out.unshift(slab);
  out.forEach((b, i) => (b.id = `${cut ? "c" : "b"}${i}`));
  return out;
}

const DOOR_PARTS = [
  { faces: headDoor(), layer: 1, x: 572 },
  { faces: doorFrame().flat(), split: doorFrame(), layer: 3, x: 14765 },
  { faces: doorLeaf(0).flat(), split: doorLeaf(0), layer: 3, live: true, x: 14705 },
  { faces: hinges().flat(), split: hinges(), layer: 3, x: 14752 },
];

function build(cut) {
  const bodies = bodiesOf(cut ? MODEL.cutItems : MODEL.items, cut);
  const chunks = [];
  for (const b of bodies) {
    Object.assign(b, motionOf(b), { asm: ASM[b.kind], label: labelOf(b) });
    chunksOf(b).forEach((c, i) => chunks.push({ ...c, body: b, i, key: depth(centroid(c.polys)) }));
  }
  const doors = DOOR_PARTS.filter((d) => !cut || d.x < CUT).map((d, i) => ({
    layer: d.layer, band: 3, key: depth(centroid(d.faces.map((f) => f.p))) + (d.live ? 1 : 0), door: d,
    body: { id: `${cut ? "c" : "b"}d${i}`, kind: "door", asm: "ends", label: labelOf({ kind: "door" }), open: [0, 0, 0], pop: [0, 0, 0], lo: [d.x, 0, 0], hi: [d.x, 0, 0] },
  }));
  const all = [...chunks, ...doors].sort((a, b) => a.layer - b.layer || a.band - b.band || a.key - b.key);
  all.forEach((c, i) => (c.order = i));
  const svgs = new Map();
  for (const b of bodies) {
    const own = all.filter((c) => c.body === b);
    const list = bodySvg(b, own, (ci) => own[ci].order);
    own.forEach((c, ci) => svgs.set(c, list[ci]));
  }
  for (const c of all)
    if (c.door) {
      const parts = c.door.split || [c.door.faces];
      svgs.set(c, parts.map((f) => G.solid(f, { tone: "hi", inset: c.door.split ? 0 : [40, 150] })).join(""));
    }
  return {
    bodies,
    html: all
      .map((c) => {
        const b = c.body;
        return `<g class="hh-item" data-unit="${b.id}" data-asm="${b.asm}" data-label="${b.label.join("|")}" data-open="${b.open.join(",")}" data-pop="${b.pop.join(",")}" data-y1="${b.hi[1]}"${c.door?.live ? ' data-live="leaf"' : ""}>${svgs.get(c)}</g>`;
      })
      .join(""),
    layer3: all.findIndex((c) => c.layer === 3),
    all,
  };
}

function dimSvg(a, b) {
  const pa = at(a);

const LIFT = 2400;

function montage() {
  if (state.cut) setCut(false);

  openBtn.setAttribute("aria-pressed", "false");

  for (const u of UNITS) {
    toHome(u);
    Object.assign(u.drop, { at: 1, v: 0, target: 1 });
  }
  let t = 0.3;
  let prev = UNITS[0].stage;
  for (const u of UNITS) {
    if (u.stage !== prev) (t += 0.5), (prev = u.stage);
    u.start = t;

function montageStep(dt) {

const nodeOf = new Map(nodes.map((n) => [n.el, n]));
const PROPS = ["fill", "fill-opacity", "fill-rule", "stroke", "stroke-width", "stroke-opacity", "stroke-linejoin", "stroke-linecap", "stroke-dasharray", "opacity", "display", "visibility"];
const DPR = () => Math.min(2, window.devicePixelRatio || 1);
const unitScale = () => root.getBoundingClientRect().width / root.viewBox.baseVal.width; // CSS px на одиницю креслення
const SVG_ONLY = new URLSearchParams(location.search).has("svgonly"); // для порівняння швидкості
let spritesOn = false;
let spriteScale = 0;
let building = null;
const variant = (n) => `${n.el.hasAttribute("data-sel") ? "s" : ""}${n.el.hasAttribute("data-hover") ? "h" : ""}${stage.hasAttribute("data-has-sel") ? "d" : ""}${n.el === leafNode ? leafAngle : ""}`;
const resetSprites = () =>
  nodes.forEach((n) => {
    for (const sp of n.sprites?.values() || []) if (n.shown !== sp) URL.revokeObjectURL(sp.url);
    n.sprites = new Map();
  });
resetSprites();
function spritesReady() {
  const sc = unitScale() * DPR();
  if (!sc || state.cut || SVG_ONLY) return false; // у розрізі повна споруда схована — знімати нічого
  if (Math.abs(sc - spriteScale) / sc > 0.2) {
    // інший розмір екрана — старі знімки були б розмиті
    resetSprites();
    spriteScale = sc;
  }
  const need = [];
  for (const n of nodes) {
    n.sp = n.sprites.get(variant(n));
    if (!n.sp) need.push(n);
  }
  if (!need.length) return true;
  if (!building) building = makeSprites(need, spriteScale).catch(() => {}).finally(() => ((building = null), kick()));
  return false;
}
// знімок стилів: обчислені значення вписуються в копію деталі, тож картинка не залежить від таблиць стилів сторінки
function snapshot(list, sc) {
  const moving = stage.hasAttribute("data-moving");
  stage.setAttribute("data-snap", "");
  if (moving) stage.removeAttribute("data-moving");
  const cs0 = getComputedStyle(stage);
  const defs = DEFS.replace(/var\((--[\w-]+)\)/g, (_, v) => cs0.getPropertyValue(v).trim());
  const memo = new Map();
  const u = unitScale();
  const vb = root.viewBox.baseVal;
  const pad = 4 / u;
  const jobs = [];
  try {
    for (const n of list) {
      const key = variant(n);
      // межі знімка — по пікселях екрана, а розмір — ціле число пікселів: картинка лягає без перерахунку й не розмивається
      const bb = n.el.getBBox();
      const x = vb.x + Math.floor((bb.x - pad - vb.x) * sc) / sc;
      const y = vb.y + Math.floor((bb.y - pad - vb.y) * sc) / sc;
      const W = Math.max(1, Math.ceil((bb.x + bb.width + pad - x) * sc));
      const H = Math.max(1, Math.ceil((bb.y + bb.height + pad - y) * sc));
      const w = W / sc;
      const h = H / sc;
      const clone = n.el.cloneNode(true);
      clone.removeAttribute("transform");
      clone.removeAttribute("style");
      const src = n.el.querySelectorAll("*");
      const dst = clone.querySelectorAll("*");
      src.forEach((e, i) => {
        const id = `${key}|${e.tagName}|${e.getAttribute("class")}|${e.getAttribute("data-shade")}|${e.getAttribute("data-tone")}|${e.parentNode.getAttribute("class")}|${e.getAttribute("style") || ""}`;
        let st = memo.get(id);
        if (st == null) {
          const cs = getComputedStyle(e);
          st = PROPS.map((p) => {
            let v = cs.getPropertyValue(p);
            // у сцені лінії «нерозтяжні» (у CSS px екрана) — у знімку переводимо в одиниці креслення
            if (p === "stroke-width") v = `${(parseFloat(v) || 0) / u}`;
            else if (p === "fill" || p === "stroke") v = v.replace(/url\(["']?[^#"')]*#([^"')]+)["']?\)/, "url(#$1)");
            return `${p}:${v}`;
          }).join(";");
          memo.set(id, st);
        }
        dst[i].setAttribute("style", st);
      });
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="none">${defs}${new XMLSerializer().serializeToString(clone)}</svg>`;
      jobs.push({ n, key, x, y, w, h, W, H, svg });
    }
  } finally {
    stage.removeAttribute("data-snap");
    if (moving) stage.setAttribute("data-moving", "");
  }
  return jobs;
}
async function makeSprites(list, sc) {
  const jobs = snapshot(list, sc);
  await Promise.all(jobs.map(async (j) => {
    // знімок — звичайна картинка: браузер растеризує її один раз і далі лише зсуває шар
    const url = URL.createObjectURL(new Blob([j.svg], { type: "image/svg+xml" }));
    const img = new Image(j.W, j.H);
    img.alt = "";
    img.decoding = "sync";
    img.src = url;
    try {
      await (img.decode ? img.decode() : new Promise((ok, no) => ((img.onload = ok), (img.onerror = no))));
    } catch (e) {
      URL.revokeObjectURL(url);
      throw e;
    }
    if (sc !== spriteScale) return URL.revokeObjectURL(url);
    const m = j.n.sprites;
    m.set(j.key, { el: img, url, x: j.x, y: j.y, w: j.w, h: j.h, tf: "", u: 0, vis: true });
    if (m.size > 4) {
      // кілька останніх станів деталі, не більше
      const [key, old] = m.entries().next().value;
      m.delete(key);
      if (j.n.shown !== old) (old.el.remove(), URL.revokeObjectURL(old.url));
    }
  }));
}
function paint() {
  const v = root.viewBox.baseVal;
  const u = root.getBoundingClientRect().width / v.width;
  const dpr = DPR();
  const px = (val) => (Math.round(val * u * dpr) / dpr).toFixed(2); // зсув — цілими пікселями екрана, щоб знімок лишався чітким
  // порядок шарів як у SVG: деталі на місцях, потім ті, що зараз опускає кран
  const order = nodes.filter((n) => n.el.parentNode !== lift);
  for (const el of lift.children) if (nodeOf.has(el)) order.push(nodeOf.get(el));
  order.forEach((n, i) => {
    const sp = n.sp;
    if (n.shown !== sp) {
      if (n.shown) n.shown.el.remove();
      n.shown = sp;
    }
    if (deck.children[i] !== sp.el) deck.insertBefore(sp.el, deck.children[i] || null);
    if (sp.u !== u) {
      sp.u = u;
      sp.el.style.width = `${sp.w * u}px`;
      sp.el.style.height = `${sp.h * u}px`;
    }
    const tf = `translate3d(${px(sp.x + n.xy[0] - v.x)}px,${px(sp.y + n.xy[1] - v.y)}px,0)`;
    if (sp.tf !== tf) sp.el.style.transform = sp.tf = tf;
    const vis = !n.hide;
    if (sp.vis !== vis) sp.el.style.visibility = (sp.vis = vis) ? "" : "hidden";
  });
}
// знімки звичайного стану готуємо заздалегідь, щоб перший же рух був плавним
setTimeout(() => spritesReady(), 600);

// ---------- дотик, наведення, свайп ----------
// Наведення або дотик до деталі — вона підстрибує, поруч з'являється її назва.
// Свайп по кресленню вгору — деталі розходяться (розкриття), вниз — сходяться.
const drag = { on: false, y0: 0, f0: 0, moved: false, id: null };
let hoverUnit = null;
function popUnit(unit) {
  if (hoverUnit === unit) return;
  if (hoverUnit && pops.get(hoverUnit)) pops.get(hoverUnit).target = 0;
  hoverUnit = unit;
  if (unit && pops.get(unit) && !state.montage) pops.get(unit).target = 1;
  state.hover = unit;
  render();
  kick();
}
function showTip(item, x, y) {
  const [a, b] = (item?.dataset.label || "").split("|");
  if (!a || state.montage) return void tip.classList.remove("on");
  if (tip.dataset.for !== item.dataset.label) {
    tip.dataset.for = item.dataset.label;
    tip.innerHTML = `<b>${a}</b><span>${b}</span>`;
  }
  const box = (tip.offsetParent || stage).getBoundingClientRect();
  tip.style.transform = `translate(${Math.round(x - box.left + 14)}px, ${Math.round(y - box.top + 16)}px)`;
  tip.classList.add("on");
}
const openAmount = () => Math.max(...["vault", "buttress", "walls"].map((id) => amt[id].at));
root.addEventListener("pointerdown", (e) => {
  if (state.montage) return;
  const item = e.target.closest(".hh-item");
  Object.assign(drag, { on: false, y0: e.clientY, f0: openAmount(), moved: false, id: e.pointerId, item });
  if (e.pointerType !== "mouse" && item) {
    popUnit(item.dataset.unit);
    showTip(item, e.clientX, e.clientY);
  }
});
root.addEventListener("pointermove", (e) => {
  if (drag.id === e.pointerId && (e.buttons || e.pointerType !== "mouse")) {
    const dy = e.clientY - drag.y0;
    if (!drag.moved && Math.abs(dy) > 8) {
      drag.moved = true;
      drag.on = true;
      if (state.cut) setCut(false);
      try {
        root.setPointerCapture(e.pointerId);
      } catch {
        // палець уже відпущено — захоплювати нічого
      }
      tip.classList.remove("on");
    }
    if (drag.on) {
      const f = Math.max(0, Math.min(1, drag.f0 - dy / 220));
      // шари розходяться по черзі: дах, контрфорси, стіни
      ["vault", "buttress", "walls"].forEach((id, i) => {
        amt[id].at = Math.max(0, Math.min(1, f * 1.5 - i * 0.25));
        amt[id].v = 0;
        amt[id].delay = 0;
      });
      kick();
      return;
    }
  }
  if (e.pointerType !== "mouse") return;
  const item = e.target.closest(".hh-item");
  popUnit(item ? item.dataset.unit : null);
  showTip(item, e.clientX, e.clientY);
});
const endDrag = (e) => {
  if (drag.id !== e.pointerId) return;
  if (drag.on) {
    drag.on = false;
    setOpen(openAmount() > 0.45);
  } else if (!drag.moved && drag.item && !state.montage) select(drag.item.dataset.asm);
  drag.id = null;
  if (e.pointerType !== "mouse")
    setTimeout(() => {
      popUnit(null);
      tip.classList.remove("on");
    }, 1400);
};
root.addEventListener("pointerup", endDrag);
root.addEventListener("pointercancel", endDrag);
root.addEventListener("pointerleave", (e) => {
  if (e.pointerType === "mouse" && !drag.on) {
    popUnit(null);
    tip.classList.remove("on");
  }
});

chips.forEach((c) => c.addEventListener("click", () => !state.montage && select(c.dataset.layer)));
openBtn.addEventListener("click", () => !state.montage && setOpen(!state.open));
cutBtn.addEventListener("click", () => setCut(!state.cut));
playBtn.addEventListener("click", montage);
card.querySelector("[data-card-close]").addEventListener("click", () => (state.waveCard ? ((state.waveCard = false), render()) : select(state.sel)));
card.querySelector("[data-card-prev]").addEventListener("click", () => step(-1));
card.querySelector("[data-card-next]").addEventListener("click", () => step(1));
function step(by) {
  const i = state.sel ? ORDER.indexOf(state.sel) : by > 0 ? -1 : ORDER.length;
  const next = ORDER[(i + by + ORDER.length) % ORDER.length];
  state.sel = null;
  select(next);
}
document.addEventListener("keydown", (e) => {
  const el = e.target instanceof Element ? e.target : null;
  if (el?.closest("input,textarea,select")) return;
  if (el?.closest("button") && (e.key === " " || e.key === "Enter")) return; // кнопка сама обробить натискання
  const key = e.key.toLowerCase();
  if (state.montage && key !== "m" && key !== "ь") return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === " ") setOpen(!state.open);
  else if (e.key === "Escape" && (state.sel || state.waveCard)) state.waveCard ? ((state.waveCard = false), render()) : select(state.sel);
  else if (key === "m" || key === "ь") montage();
  else if (key === "w" || key === "ц") launch();
  else if (key === "c" || key === "с") setCut(!state.cut);
  else return;
  e.preventDefault();
});

render();
draw();
// для покадрової перевірки
const seek = (t, amp = wave.amp) => {
  Object.assign(wave, { amp, on: true, clock: t });
  needle.at = gaugeAt(t);
  needle.peak = Math.max(needle.peak, needle.at);
  waveDraw();
};
const seekMontage = (t) => {
  if (!state.montage) montage();
  cancelAnimationFrame(frame);
  frame = 0;
  const m = state.montage;
  m.clock = 0;
  for (const u of UNITS) Object.assign(u.drop, { at: 1, v: 0, target: 1 });
  const dt = 1 / 60;
  for (let c = 0; c < t; c += dt) {
    montageStep(dt);
    if (!state.montage) break;
    for (const u of UNITS) if (u.drop.at !== u.drop.target) spring(u.drop, dt, 26, 2 * Math.sqrt(26) * 1.15);
  }
  draw();
  craneDraw();
};
const settle = () => {
  for (const id of ORDER) Object.assign(amt[id], { at: amt[id].target, v: 0, delay: 0 });
  door.at = door.target;
  draw();
};
// показати поточний кадр зі знімків (для перевірки, що знімки збігаються з живим SVG)
const spriteFrame = async (on = true) => {
  while (!spritesReady()) await (building || new Promise((r) => setTimeout(r, 50)));
  draw(true);
  paint();
  stage.toggleAttribute("data-sprites", on);
};
window.HH = { state, amt, setOpen, setCut, select, montage, launch, seek, seekMontage, settle, popUnit, wave, needle, UNITS, nodes, spriteFrame };

// параметри адреси для знімків перевірки: ?view=cut|open|wave&t=1.4&kpa=420&montage=5&sel=ends&zoom=0.5,0.5,2
{
  const q = new URLSearchParams(location.search);
  const view = q.get("view");
  if (view === "cut") setCut(true);
  if (view === "open") (setOpen(true), settle());
  if (q.get("sel")) (select(q.get("sel")), settle());
  if (view === "wave") {
    for (let t = 0; t <= Number(q.get("t") || 1); t += 0.02) seek(t, Number(q.get("kpa") || 420));
    state.waveCard = true;
    render();
  }
  if (q.get("montage")) seekMontage(Number(q.get("montage")));
  if (q.get("pop")) (popUnit(q.get("pop")), (pops.get(q.get("pop")).at = 1), draw());
  if (q.get("zoom")) {
    const [fx, fy, z] = q.get("zoom").split(",").map(Number);
    const svg = root;
    svg.setAttribute("viewBox", `${fx * VW - VW / z / 2} ${fy * VH - VH / z / 2} ${VW / z} ${VH / z}`);
    bgRoot.setAttribute("viewBox", svg.getAttribute("viewBox"));
  }
}
