<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HH Презентер</title>
</head>
<body style="margin:0;background:#fff;color:#1F2328;font:17px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
<p style="text-align:center;margin-top:42vh">Відкриваю застосунок…</p>
<script>
/* Ця сторінка видна лише тоді, коли Safari ще не підключив service worker (він розшифровує справжній застосунок).
   Підключаємо його й перезавантажуємо; якщо не вийшло — повертаємось на сторінку входу. */
(async function () {
  try {
    if (!("serviceWorker" in navigator)) throw new Error("no-sw");
    await navigator.serviceWorker.register("sw.js", {scope: "./", updateViaCache: "none"});
    await navigator.serviceWorker.ready;
    if (navigator.serviceWorker.controller) { location.reload(); return; }
    navigator.serviceWorker.addEventListener("controllerchange", () => location.reload(), {once: true});
    setTimeout(() => location.replace("./"), 6000);
  } catch (e) { location.replace("./"); }
})();
</script>
</body>
</html>
